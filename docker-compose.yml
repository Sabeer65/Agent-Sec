services:
  agent-sec:
    build: .
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./reports:/app/reports

  dashboard:
    build: .
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./reports:/app/reports
    ports:
      - "8501:8501"
    command: streamlit run dashboard/app.py --server.address=0.0.0.0